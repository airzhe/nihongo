<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語文法クエスト</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap');

    :root {
        --text-main: #111827; 
        --text-muted: #6b7280;
        --border-light: #e5e7eb;
        --bg-page: #f9fafb;
        --bg-card: #ffffff;
        
        --color-correct: #059669;
        --bg-correct: #f0fdf4;
        --color-error: #dc2626;
        --bg-error: #fef2f2;
    }
    
    *, *::before, *::after { 
        box-sizing: border-box; margin: 0; padding: 0; 
        
        /* 1. 彻底去除所有按钮点击时系统自带的丑陋外框 */
        outline: none !important; 
        
        /* 2. 去除手机端点击时瞬间闪过的灰色/半透明遮罩 */
        -webkit-tap-highlight-color: transparent; 
    }

    body {
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh; padding: 20px;
        -webkit-font-smoothing: antialiased; 
    }
    
    #game-container {
        background-color: var(--bg-card);
        padding: 40px 50px 50px;
        border-radius: 16px; 
        border: 1px solid var(--border-light);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); 
        width: 100%; max-width: 800px;
        position: relative; overflow: hidden;
        display: flex; flex-direction: column; min-height: 700px;
    }

    #progress-bar { position: absolute; top: 0; left: 0; height: 3px; background-color: var(--text-main); transition: width 0.4s ease; opacity: 0.8; }

    .header-section { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: baseline; }
    h1 { color: var(--text-main); font-weight: 600; font-size: 1.4em; letter-spacing: -0.5px; margin-bottom: 4px;}
    #subtitle { color: var(--text-muted); font-size: 0.85em; font-weight: 400; }
    #score { font-size: 0.9em; font-weight: 500; color: var(--text-muted); }

    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 15px; border-bottom: 1px solid var(--border-light); }
    .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
    
    .btn, .custom-select-trigger { 
        background: transparent; border: none; color: var(--text-muted); 
        padding: 6px 10px; cursor: pointer; font-weight: 500; font-size: 0.9em; 
        transition: color 0.2s ease, background-color 0.2s ease; /* 使用渐变色代替位移 */
        touch-action: manipulation;
    }
    .btn:hover, .custom-select-trigger:hover { color: var(--text-main); }
    .level-btn { position: relative; padding: 4px 8px; }
    .level-btn.active { color: var(--text-main); font-weight: 600; }
    .level-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background-color: var(--text-main); }
    
    #review-btn.active { color: var(--color-error); font-weight: 600; }
    #clear-mistakes-btn { color: var(--color-error); opacity: 0.6; }
    #clear-mistakes-btn:hover { opacity: 1; }

    .custom-select-wrapper { position: relative; z-index: 20; } 
    .custom-select-trigger { display: flex; align-items: center; gap: 6px; padding: 6px 0;}
    .custom-select-trigger .arrow { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid currentColor; opacity: 0.6; transition: transform 0.2s ease; }
    .custom-select-wrapper.open .arrow { transform: rotate(180deg); }
    .custom-select-options { position: absolute; top: 100%; left: -10px; width: 140px; border: 1px solid var(--border-light); border-radius: 8px; background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.05); opacity: 0; visibility: hidden; transform: translateY(-5px); transition: all 0.2s ease; padding: 8px; }
    .custom-select-wrapper.open .custom-select-options { opacity: 1; visibility: visible; transform: translateY(0); }
    .custom-option { padding: 8px 12px; border-radius: 6px; font-weight: 400; cursor: pointer; font-size: 0.9em; color: var(--text-muted); transition: background-color 0.2s ease; }
    .custom-option:hover { background-color: var(--bg-page); color: var(--text-main); }
    .custom-option.selected { color: var(--text-main); font-weight: 600; background-color: transparent;}

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-enter { animation: fadeIn 0.4s ease forwards; }

    #sentence-area { min-height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
    #sentence-container { font-size: 1.5em; line-height: 1.8; color: var(--text-main); font-weight: 500; text-align: center; }
    #sentence-container .blank { color: transparent; border-bottom: 1px solid var(--text-muted); padding: 0 2px; margin: 0 8px; display: inline-block; min-width: 80px; height: 1.2em; transition: border-color 0.3s ease; }
    #sentence-container .highlight { color: var(--text-main); border-bottom: none; font-weight: 600; }
    
    #options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
    .option-btn { 
        display: flex; align-items: center; padding: 0 20px; height: 64px; 
        font-size: 1.05em; background-color: #fff; border: 1px solid var(--border-light); 
        border-radius: 12px; cursor: pointer; 
        transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease; /* 只做颜色渐变，无形变 */
        font-weight: 500; color: var(--text-main); touch-action: manipulation;
        -webkit-user-select: auto; user-select: auto; 
    }
    .option-btn:hover:not(.answered) { border-color: #9ca3af; }
    /* 彻底删除了 .option-btn:active 的形变代码 */
    .option-btn.answered { cursor: default; }
    
    .key-hint { font-size: 0.85em; font-weight: 400; color: #9ca3af; width: 30px; border-right: 1px solid var(--border-light); display: flex; align-items: center; justify-content: flex-start; margin-right: 15px; transition: color 0.2s ease, border-color 0.2s ease;}
    
    .option-text { cursor: text; -webkit-user-select: text; user-select: text; flex-grow: 1; text-align: left; }
    
    /* 答题状态：去除 pop 动画，只有安静的颜色变化 */
    .option-btn.correct { border-color: var(--color-correct); color: var(--color-correct); background: var(--bg-card); }
    .option-btn.correct .key-hint { color: var(--color-correct); border-color: #a7f3d0; }
    .option-btn.selected.incorrect { border-color: var(--color-error); color: var(--color-error); background: var(--bg-card); }
    .option-btn.selected.incorrect .key-hint { color: var(--color-error); border-color: #fecaca; }
    
    .bottom-section { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;}
    #feedback { width: 100%; padding: 24px; border-radius: 12px; text-align: left; font-size: 0.95em; line-height: 1.8; height: 160px; overflow-y: auto; scrollbar-width: none; visibility: hidden; opacity: 0; transition: opacity 0.3s ease; margin-bottom: 20px; }
    #feedback::-webkit-scrollbar { display: none; }
    #feedback.visible { visibility: visible; opacity: 1; }
    
    #feedback.correct { background-color: var(--bg-correct); color: var(--color-correct); }
    #feedback.incorrect { background-color: var(--bg-error); color: var(--color-error); }
    #feedback-title { font-weight: 600; font-size: 1.1em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    #feedback p { margin: 6px 0; font-weight: 400; }
    #feedback strong { font-weight: 600; }

    #next-btn-container { height: 50px; display: flex; justify-content: center; visibility: hidden; opacity: 0; transition: opacity 0.3s ease; width: 100%; }
    #next-btn-container.visible { visibility: visible; opacity: 1; }

    #next-btn { 
        padding: 0 40px; height: 48px; font-size: 1em; font-weight: 500; 
        background-color: var(--text-main); color: #fff; border-radius: 8px; 
        border: none; cursor: pointer; transition: background-color 0.2s ease; /* 去除 active 形变，只保留悬停颜色渐变 */
        touch-action: manipulation; width: 100%; max-width: 260px;
    }
    #next-btn:hover { background-color: #374151; }
    /* 彻底删除了 #next-btn:active 的形变代码 */
    
    #notification { position: fixed; top: 30px; left: 50%; transform: translate(-50%, -20px); background-color: var(--text-main); color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 0.9em; font-weight: 500; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; }
    #notification.visible { opacity: 1; transform: translate(-50%, 0); }
    
    .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(17, 24, 39, 0.3); backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s ease; }
    .modal.show { display: flex; justify-content: center; align-items: center; opacity: 1; }
    .modal-content { background-color: #fff; border-radius: 16px; width: 90%; max-width: 600px; height: 80vh; max-height: 700px; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.1); transform: translateY(-10px); transition: transform 0.3s ease; overflow: hidden;}
    .modal.show .modal-content { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 15px; }
    .modal-header h2 { font-size: 1.1em; margin: 0; color: var(--text-main); font-weight: 600; }
    .close-btn { font-size: 1.6em; color: #9ca3af; cursor: pointer; line-height: 1; font-weight: 300; transition: color 0.2s ease;}
    .close-btn:hover { color: var(--text-main); }
    .modal-search { padding: 0 24px 15px; border-bottom: 1px solid var(--border-light); }
    #dict-search { width: 100%; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.95em; outline: none; transition: border-color 0.2s ease, background-color 0.2s ease; background: var(--bg-page); color: var(--text-main); }
    #dict-search:focus { border-color: var(--text-muted); background: #fff; }
    .dict-results { padding: 15px 24px; overflow-y: auto; flex-grow: 1; }
    .dict-item { background: #fff; border-bottom: 1px solid var(--border-light); padding: 16px 0; white-space: pre-wrap; font-size: 0.9em; line-height: 1.7; color: var(--text-main); }
    .dict-item:last-child { border-bottom: none; }
    .highlight-text { background-color: #fef08a; color: #b45309; font-weight: 500; padding: 0 2px; }

    @media (max-width: 768px) {
        body { padding: 0; background: var(--bg-card); }
        #game-container { padding: 25px 20px 60px; min-height: 100vh; border-radius: 0; border: none; box-shadow: none; max-width: 100%;}
        
        .header-section { margin-bottom: 20px; flex-wrap: wrap;}
        h1 { font-size: 1.35em; }
        .app-header { flex-direction: column; align-items: flex-start; gap: 15px; margin-bottom: 20px; padding-bottom: 15px;}
        .header-left, .header-right { width: 100%; justify-content: space-between; gap: 5px; }
        .custom-select-wrapper { margin-left: -5px;}
        
        #sentence-area { min-height: 80px; margin-bottom: 30px; }
        #sentence-container { font-size: 1.25em; line-height: 1.6; }
        
        #options-container { grid-template-columns: 1fr; gap: 16px; margin-bottom: 25px;}
        .option-btn { height: auto; padding: 18px 16px; border-radius: 12px;}
        
        #feedback { height: auto; min-height: 120px; max-height: none; padding: 20px; margin-bottom: 20px;}
        
        #next-btn { width: 100%; max-width: none; height: 54px; font-size: 1.05em; border-radius: 12px;}
        
        .modal-content { width: 100%; height: 92vh; border-radius: 20px 20px 0 0; position: absolute; bottom: 0; transform: translateY(100%);}
        .modal.show .modal-content { transform: translateY(0); }
    }
</style>
</head>
<body>
    
<div id="game-container">
    <div id="progress-bar"></div>

    <div class="header-section">
        <div>
            <h1>日本語文法クエスト</h1>
            <p id="subtitle">JLPT N1 & N2 Grammar Mastery</p>
        </div>
        <div id="score">Score: 0 / 0</div>
    </div>
    
    <header class="app-header">
        <div class="header-left">
            <div class="custom-select-wrapper">
                <div id="custom-select-trigger" class="custom-select-trigger">
                    <span>練習セット 1</span>
                    <div class="arrow"></div>
                </div>
                <div id="custom-select-options" class="custom-select-options">
                    <div class="custom-option" data-value="1">練習セット 1</div>
                    <div class="custom-option" data-value="2">練習セット 2</div>
                    <div class="custom-option" data-value="3">練習セット 3</div>
                </div>
            </div>

            <div class="control-group" id="level-filter-group">
                <button id="filter-all" class="btn level-btn active">All</button>
                <button id="filter-n2" class="btn level-btn">N2</button>
                <button id="filter-n1" class="btn level-btn">N1</button>
            </div>
        </div>

        <div class="header-right">
             <button id="dict-btn" class="btn">📖 文法辞典</button>
             <button id="review-btn" class="btn">復習モード (0)</button>
             <button id="clear-mistakes-btn" class="btn" style="display: none;">クリア</button>
        </div>
    </header>

    <div id="sentence-area">
        <div id="sentence-container">Loading...</div>
    </div>
    
    <div id="options-container"></div>
    
    <div class="bottom-section">
        <div id="feedback"></div>
        <div id="next-btn-container">
            <button id="next-btn">次の問題 (Enter)</button>
        </div>
    </div>
</div>

<div id="notification"></div>
<div id="dict-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📖 文法辞典</h2>
            <span class="close-btn">&times;</span>
        </div>
        <div class="modal-search">
            <input type="search" id="dict-search" placeholder="検索... (例: かかわらず)">
        </div>
        <div id="dict-results" class="dict-results">
            <div style="text-align:center; color:#9ca3af; padding: 20px;">読み込み中...</div>
        </div>
    </div>
</div>

<script>
    let grammarData = [];
    let dataByLevel = { N1: [], N2: [] };
    let allAnswersPool = [];
    let shuffledQuestionPool = [];
    let currentQuestionIndex = 0;

    const sentenceContainer = document.getElementById('sentence-container');
    const optionsContainer = document.getElementById('options-container');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const nextBtnContainer = document.getElementById('next-btn-container'); 
    const scoreEl = document.getElementById('score');
    const reviewBtn = document.getElementById('review-btn');
    const clearMistakesBtn = document.getElementById('clear-mistakes-btn');
    const levelFilterButtons = document.querySelectorAll('.level-btn');
    const customSelectWrapper = document.querySelector('.custom-select-wrapper');
    const customSelectTrigger = document.getElementById('custom-select-trigger');
    const customSelectOptions = document.querySelectorAll('.custom-option');
    const notificationEl = document.getElementById('notification');
    let notificationTimeout;

    const optionButtons = [];
    const optionTextElements = [];
    const keyHintElements = [];

    let currentQuestion = {}, score = 0, totalQuestions = 0, isAnswered = false;
    let mistakeIds = [];
    let isReviewMode = false, currentLevel = 'All', currentSetId = '1', pausedState = null;

    const idleCallback = window.requestIdleCallback || ((cb) => setTimeout(cb, 1));

    function showNotification(message) {
        clearTimeout(notificationTimeout);
        notificationEl.textContent = message;
        notificationEl.classList.add('visible');
        notificationTimeout = setTimeout(() => {
            notificationEl.classList.remove('visible');
        }, 2500);
    }

    function initUI() {
        for (let i = 0; i < 4; i++) {
            const button = document.createElement('button');
            button.className = 'option-btn';
            const keyHint = document.createElement('span');
            keyHint.className = 'key-hint';
            keyHint.textContent = i + 1;
            const optionText = document.createElement('span');
            optionText.className = 'option-text';
            button.appendChild(keyHint);
            button.appendChild(optionText);
            optionsContainer.appendChild(button);
            optionButtons.push(button);
            keyHintElements.push(keyHint);
            optionTextElements.push(optionText);
        }
    }

    function getMistakeKey() { return `japaneseGrammarMistakes_set${currentSetId}`; }
    function loadMistakes() { mistakeIds = JSON.parse(localStorage.getItem(getMistakeKey())) || []; }
    function saveMistakes() { localStorage.setItem(getMistakeKey(), JSON.stringify(mistakeIds)); }
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function updateReviewButton() {
        reviewBtn.textContent = isReviewMode ? '通常モードに戻る' : `復習モード (${mistakeIds.length})`;
        reviewBtn.disabled = mistakeIds.length === 0 && !isReviewMode;
        reviewBtn.classList.toggle('active', isReviewMode);
        clearMistakesBtn.style.display = (isReviewMode && mistakeIds.length > 0) ? 'inline-block' : 'none';
    }

    clearMistakesBtn.addEventListener('click', () => {
        if (confirm('本当に復習リストをクリアしますか？')) {
            mistakeIds = [];
            saveMistakes();
            isReviewMode = false;
            updateUiForModeChange();
            startNewQuiz(); 
            showNotification('復習リストをクリアしました！');
        }
    });

    function updateScore() {
        scoreEl.style.visibility = isReviewMode ? 'hidden' : 'visible';
        if (!isReviewMode) {
            scoreEl.textContent = `Score: ${score} / ${totalQuestions}`;
        }
    }

    function updateUiForModeChange() {
        updateReviewButton();
        updateScore();
        customSelectWrapper.style.pointerEvents = isReviewMode ? 'none' : 'auto';
        customSelectWrapper.style.opacity = isReviewMode ? '0.5' : '1';
        document.getElementById('level-filter-group').style.pointerEvents = isReviewMode ? 'none' : 'auto';
        document.getElementById('level-filter-group').style.opacity = isReviewMode ? '0.5' : '1';
        
        if (!isReviewMode) {
            levelFilterButtons.forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${currentLevel.toLowerCase()}`).classList.add('active');
        }
    }

    function startNewQuiz() {
        if (isReviewMode) {
            const reversedIds = [...mistakeIds].reverse();
            const grammarDataMap = new Map(grammarData.map(q => [q.id, q]));
            shuffledQuestionPool = reversedIds.map(id => grammarDataMap.get(id)).filter(Boolean);
        } else {
            shuffledQuestionPool = (currentLevel === 'All') ? [...grammarData] : [...dataByLevel[currentLevel]];
            shuffleArray(shuffledQuestionPool);
        }
        currentQuestionIndex = 0;
        score = 0;
        totalQuestions = 0;
        updateScore();
        displayNextQuestion();
    }

    function setLevel(level, fromUrl = false) {
        if (currentLevel === level && !isReviewMode && !fromUrl) return;
        currentLevel = level;
        pausedState = null;
        levelFilterButtons.forEach(btn => btn.classList.remove('active'));
        document.getElementById(`filter-${level.toLowerCase()}`).classList.add('active');
        if (!fromUrl) updateURL();
        startNewQuiz();
    }

    function toggleReviewMode() {
        isReviewMode = !isReviewMode;
        if (isReviewMode) {
            if (mistakeIds.length === 0) {
                showNotification("復習する問題がありません。");
                isReviewMode = false;
                return;
            }
            pausedState = { currentQuestion, shuffledQuestionPool, currentQuestionIndex, score, totalQuestions, currentLevel };
            startNewQuiz();
        } else {
            if (pausedState) {
                ({ currentQuestion, shuffledQuestionPool, currentQuestionIndex, score, totalQuestions, currentLevel } = pausedState);
                renderQuestion(currentQuestion);
                updateScore();
                pausedState = null;
            } else {
                startNewQuiz();
            }
        }
        updateUiForModeChange();
    }

    function getDistractorOptions(correctAnswer) {
        const distractors = new Set();
        if (allAnswersPool.length < 4) {
            return allAnswersPool.filter(ans => ans !== correctAnswer);
        }
        let attempts = 0;
        const maxAttempts = Math.min(allAnswersPool.length, 50);
        while (distractors.size < 3 && attempts < maxAttempts) {
            const randomIndex = Math.floor(Math.random() * allAnswersPool.length);
            const potentialDistractor = allAnswersPool[randomIndex];
            if (potentialDistractor !== correctAnswer) {
                distractors.add(potentialDistractor);
            }
            attempts++;
        }
        return Array.from(distractors);
    }

    function renderQuestion(question) {
        currentQuestion = question;
        isAnswered = false;
        requestAnimationFrame(() => {
            if(shuffledQuestionPool.length > 0) {
                const progressPercent = (currentQuestionIndex / shuffledQuestionPool.length) * 100;
                document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            } else {
                document.getElementById('progress-bar').style.width = `0%`;
            }

            const areaToAnimate = document.getElementById('sentence-area');
            const optionsToAnimate = document.getElementById('options-container');
            areaToAnimate.classList.remove('animate-enter');
            optionsToAnimate.classList.remove('animate-enter');
            void areaToAnimate.offsetWidth; 
            areaToAnimate.classList.add('animate-enter');
            optionsToAnimate.classList.add('animate-enter');

            feedbackEl.classList.remove('visible', 'correct', 'incorrect');
            nextBtnContainer.classList.remove('visible'); 
            optionsContainer.style.display = 'grid';
            
            if (!question || !question.sentence_parts) {
                sentenceContainer.innerHTML = "問題の読み込みに失敗しました。";
                optionsContainer.style.display = 'none';
                return;
            }
            const [part1, part2] = question.sentence_parts;
            sentenceContainer.innerHTML = `${part1}<span class="blank">＿＿＿</span>${part2}`;
            
            const distractors = getDistractorOptions(question.grammar_answer);
            const options = shuffleArray([question.grammar_answer, ...distractors]);
            
            optionButtons.forEach((button, index) => {
                if (options[index]) {
                    button.className = 'option-btn';
                    button.classList.remove('correct', 'incorrect', 'selected', 'answered'); 
                    button.style.display = '';
                    button.dataset.answer = options[index];
                    optionTextElements[index].textContent = options[index];
                } else {
                    button.style.display = 'none';
                }
            });
        });
    }

    function displayNextQuestion() {
        if (currentQuestionIndex >= shuffledQuestionPool.length) {
            showNotification("全ての問題を一周しました！もう一度始めます。");
            if (!isReviewMode) {
                shuffleArray(shuffledQuestionPool);
            }
            currentQuestionIndex = 0;
        }
        const nextQuestion = shuffledQuestionPool[currentQuestionIndex];
        if (!nextQuestion) {
            sentenceContainer.innerHTML = isReviewMode ? "復習する問題がありません。" : "このレベルには問題がありません。";
            optionsContainer.style.display = 'none';
            return;
        }
        currentQuestionIndex++;
        renderQuestion(nextQuestion);
    }

    function checkAnswer(selectedAnswer, selectedButton) {
        if (isAnswered) return;
        isAnswered = true;
        optionButtons.forEach(btn => btn.classList.add('answered'));
        if (!isReviewMode) totalQuestions++;
        const isCorrect = currentQuestion.grammar_answer === selectedAnswer;
        const [part1, part2] = currentQuestion.sentence_parts;
        const fullSentenceHTML = `${part1}<span class="highlight">${currentQuestion.grammar_answer}</span>${part2}`;
        const feedbackHTML = `<p><strong>文法：</strong> 「${currentQuestion.grammar_display}」</p><p><strong>接続：</strong> ${currentQuestion.connection}</p><p><strong>例文：</strong> ${fullSentenceHTML}</p>`;
        
        feedbackEl.className = ''; 
        
        if (isCorrect) {
            if (!isReviewMode) score++;
            feedbackEl.classList.add('correct', 'visible');
            feedbackEl.innerHTML = `<div id="feedback-title">🎉 正解！ (Correct)</div>${feedbackHTML}`;
            selectedButton.classList.add('correct');
            const index = mistakeIds.indexOf(currentQuestion.id);
            if (index > -1) {
                mistakeIds.splice(index, 1);
                idleCallback(() => { saveMistakes(); updateReviewButton(); });
            }
        } else {
            feedbackEl.classList.add('incorrect', 'visible');
            feedbackEl.innerHTML = `<div id="feedback-title">💔 惜しい... (Incorrect)</div>${feedbackHTML}`;
            selectedButton.classList.add('selected', 'incorrect');
            optionButtons.forEach(btn => {
                if (btn.dataset.answer === currentQuestion.grammar_answer) {
                    btn.classList.add('correct');
                }
            });
            const existingIndex = mistakeIds.indexOf(currentQuestion.id);
            if (existingIndex > -1) {
                mistakeIds.splice(existingIndex, 1);
            }
            mistakeIds.push(currentQuestion.id);
            idleCallback(() => { saveMistakes(); updateReviewButton(); });
        }
        if (!isReviewMode) updateScore();
        nextBtnContainer.classList.add('visible'); 
        nextBtn.focus();
    }

    function handleKeyPress(e) {
        // 1. 处理 ESC 关闭字典
        if (e.key === 'Escape' && dictModal.classList.contains('show')) {
            dictModal.classList.remove('show');
            return;
        }

        const activeTag = document.activeElement.tagName;
        
        // 2. 如果在搜索框里输入，不要拦截任何键（包括空格）
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        // 【核心修复】：彻底拦截空格键！防止触发任何按钮的点击或页面向下滚动
        if (e.key === ' ') {
            e.preventDefault();
            return; 
        }

        // 3. 处理快捷键 D 呼出字典
        if ((e.key === 'd' || e.key === 'D' || e.key === '/') && !dictModal.classList.contains('show')) {
            e.preventDefault(); 
            document.getElementById('dict-btn').click(); 
            return;
        }

        // 4. 防止数字键影响下拉菜单等组件
        if (activeTag === 'BUTTON' || activeTag === 'SELECT') return;

        const key = e.key;
        
        // 5. 答完题后，只认 Enter 键
        if (isAnswered) {
            if (key === 'Enter') {
                e.preventDefault();
                displayNextQuestion();
            }
            return;
        }
        
        // 6. 还没答题时，处理数字键 1-4
        const numKey = parseInt(key);
        if (!isNaN(numKey) && numKey >= 1 && numKey <= 4) {
            const button = optionButtons[numKey - 1];
            if (button && button.style.display !== 'none' && !button.classList.contains('answered')) {
                e.preventDefault();
                checkAnswer(button.dataset.answer, button);
            }
        }
    }

    function loadSet(setId, onSetLoadedCallback) {
        currentSetId = setId;
        const oldScript = document.getElementById('grammar-data-script');
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = 'grammar-data-script';
        script.src = setId === '1' ? './grammar-data.js' :
                     setId === '2' ? './grammar-data-set2.js' : './grammar-data-set3.js';
        script.onload = () => {
            dataByLevel = { N1: [], N2: [] };
            const uniqueAnswers = new Set();
            grammarData.forEach(item => {
                if (dataByLevel[item.level]) {
                    dataByLevel[item.level].push(item);
                }
                uniqueAnswers.add(item.grammar_answer);
            });
            allAnswersPool = Array.from(uniqueAnswers);
            loadMistakes();
            updateReviewButton();
            if (onSetLoadedCallback) onSetLoadedCallback();
        };
        script.onerror = () => {
            sentenceContainer.innerHTML = `エラー: 練習セット${setId}のデータファイルが見つかりません。`;
            optionsContainer.style.display = 'none';
        };
        document.body.appendChild(script);
    }

    function updateURL() {
        if (isReviewMode) return;
        const params = new URLSearchParams();
        params.set('set', currentSetId);
        if (currentLevel !== 'All') params.set('level', currentLevel);
        window.location.hash = params.toString();
    }

    function updateCustomSelectUI(setId) {
        const triggerSpan = customSelectTrigger.querySelector('span');
        const selectedOption = document.querySelector(`.custom-option[data-value="${setId}"]`);
        
        if (selectedOption && triggerSpan) {
            triggerSpan.textContent = selectedOption.textContent;
            customSelectOptions.forEach(opt => opt.classList.remove('selected'));
            selectedOption.classList.add('selected');
        }
    }

    nextBtn.addEventListener('click', displayNextQuestion);
    reviewBtn.addEventListener('click', toggleReviewMode);
    document.addEventListener('keydown', handleKeyPress);
    document.getElementById('filter-all').addEventListener('click', () => setLevel('All'));
    document.getElementById('filter-n2').addEventListener('click', () => setLevel('N2'));
    document.getElementById('filter-n1').addEventListener('click', () => setLevel('N1'));
    
    optionsContainer.addEventListener('click', (e) => {
        if (isAnswered) return;

        const selection = window.getSelection();
        if (selection && selection.toString().trim().length > 0) {
            return; 
        }

        const clickedButton = e.target.closest('.option-btn');
        if (clickedButton && clickedButton.style.display !== 'none') {
            const selectedAnswer = clickedButton.dataset.answer;
            checkAnswer(selectedAnswer, clickedButton);
        }
    });
    
    customSelectTrigger.addEventListener('click', () => customSelectWrapper.classList.toggle('open'));
    window.addEventListener('click', (e) => {
        if (!customSelectWrapper.contains(e.target)) {
            customSelectWrapper.classList.remove('open');
        }
    });

    customSelectOptions.forEach(option => {
        option.addEventListener('click', () => {
            if (!option.classList.contains('selected')) {
                const newSetId = option.getAttribute('data-value');
                loadSet(newSetId, () => {
                    updateCustomSelectUI(newSetId);
                    setLevel('All', true);
                    updateURL();
                });
            }
            customSelectWrapper.classList.remove('open');
        });
    });

    let dictionaryData = []; 
    const dictBtn = document.getElementById('dict-btn');
    const dictModal = document.getElementById('dict-modal');
    const closeBtn = document.querySelector('.close-btn');
    const dictSearch = document.getElementById('dict-search');
    const dictResults = document.getElementById('dict-results');

    dictBtn.addEventListener('click', () => {
        dictSearch.value = '';
        dictModal.classList.add('show');
        dictSearch.focus();
        if (dictionaryData.length === 0) {
            loadDictionaryTxt(); 
        } else {
            renderDictResults(dictionaryData); 
        }
    });

    closeBtn.addEventListener('click', () => dictModal.classList.remove('show'));
    window.addEventListener('click', (e) => {
        if (e.target === dictModal) dictModal.classList.remove('show');
    });

    async function loadDictionaryTxt() {
        try {
            const response = await fetch('./grammar-dict.txt'); 
            if (!response.ok) throw new Error('网络响应错误');
            const text = await response.text();
            dictionaryData = text.split(/\n\s*\n/).map(item => item.trim()).filter(item => item.length > 0);
            renderDictResults(dictionaryData);
        } catch (error) {
            dictResults.innerHTML = `<div style="color: red; text-align: center;">辞典ファイル(grammar-dict.txt)の読み込みに失敗しました。</div>`;
        }
    }

    dictSearch.addEventListener('input', (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        if (!keyword) {
            renderDictResults(dictionaryData);
            return;
        }
        const filtered = dictionaryData.filter(item => 
            item.toLowerCase().includes(keyword)
        );
        renderDictResults(filtered, keyword);
    });

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderDictResults(dataArray, keyword = '') {
        if (dataArray.length === 0) {
            dictResults.innerHTML = '<div style="text-align:center; color:#9ca3af;">見つかりませんでした。</div>';
            return;
        }
        dictResults.innerHTML = dataArray.map(item => {
            let displayText = item;
            if (keyword) {
                const safeKeyword = escapeRegExp(keyword);
                const regex = new RegExp(`(${safeKeyword})`, 'gi');
                displayText = item.replace(regex, `<span class="highlight-text">$1</span>`);
            }
            return `<div class="dict-item">${displayText}</div>`;
        }).join('');
    }

    window.onload = () => {
        initUI();
        const params = new URLSearchParams(window.location.hash.substring(1));
        const initialSet = params.get('set') || '1';
        const initialLevel = params.get('level') || 'All';
        
        loadSet(initialSet, () => {
            updateCustomSelectUI(initialSet);
            setLevel(initialLevel, true);
        });
    };
</script>
</body>
</html>
