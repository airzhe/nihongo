<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語文法クエスト</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
        --primary-color: #4a90e2;
        --primary-hover: #357abd;
        --correct-bg: #e8f5e9; --correct-text: #2e7d32; --correct-border: #a5d6a7;
        --incorrect-bg: #ffebee; --incorrect-text: #c62828; --incorrect-border: #ef9a9a;
        --bg-color: #f7f9fc;
        --card-bg: #ffffff;
        --text-color: #2c3e50;
        --light-text-color: #95a5a6;
        --border-color: #edf2f7;
        --shadow-color: rgba(149, 157, 165, 0.08);
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    
    #game-container {
        background-color: var(--card-bg);
        padding: 50px 60px;
        border-radius: 24px; 
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.04);
        width: 100%;
        max-width: 900px;
        text-align: center;
        position: relative;
        min-height: 800px;
        display: flex;
        flex-direction: column;
    }

    /* 标题区域 */
    .header-section { margin-bottom: 25px; flex-shrink: 0; }
    h1 { color: var(--primary-color); margin-bottom: 8px; font-weight: 700; font-size: 2.2em; letter-spacing: -1px; }
    #subtitle { color: var(--light-text-color); font-size: 0.95em; font-weight: 500; opacity: 0.8; }
    
    /* 顶部控制栏 */
    .app-header { 
        display: flex; justify-content: space-between; align-items: center; 
        padding-bottom: 10px; margin-bottom: 20px; 
        flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    
    /* 难度筛选器 */
    .control-group { display: flex; background: transparent; padding: 0; gap: 5px; }
    .btn { 
        background: transparent; border: none; color: #b0b0b0; 
        padding: 5px 12px; border-radius: 8px; cursor: pointer; 
        font-weight: 600; font-size: 0.85em; transition: all 0.2s; 
    }
    .btn:hover { color: var(--text-color); background-color: #f8f9fa; }
    .level-btn.active { background-color: #f1f3f5; color: #555; box-shadow: none; }
    
    /* 复习按钮 */
    #review-btn { 
        border: 1px solid transparent; background: transparent; 
        padding: 5px 12px; border-radius: 8px; font-size: 0.85em; color: #b0b0b0;
    }
    #review-btn:hover { background-color: #f8f9fa; color: var(--text-color); }
    #review-btn.active { background-color: #f3e5f5; color: #8e24aa; }

    /* 下拉菜单 */
    .custom-select-wrapper { position: relative; user-select: none; z-index: 20; } /* z-index 提高 */
    .custom-select-trigger { 
        display: flex; align-items: center; justify-content: space-between; 
        padding: 5px 12px; min-width: auto; 
        background: #f8f9fa; border: 1px solid transparent; border-radius: 8px; 
        cursor: pointer; transition: all 0.2s; 
        font-weight: 600; color: #888; font-size: 0.85em;
    }
    .custom-select-trigger:hover { background: #f1f3f5; color: #555; }
    .custom-select-trigger .arrow { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid currentColor; margin-left: 8px; opacity: 0.5; transition: transform 0.2s; }
    .custom-select-wrapper.open .arrow { transform: rotate(180deg); }

    .custom-select-options { 
        position: absolute; top: calc(100% + 5px); left: 0; 
        width: 140px; /* 默认宽度 */
        border: 1px solid var(--border-color); border-radius: 8px; background: #fff; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        opacity: 0; visibility: hidden; pointer-events: none; 
        transform: translateY(-5px); transition: all 0.2s; 
    }
    .custom-select-wrapper.open .custom-select-options { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .custom-option { padding: 8px 12px; font-weight: 500; cursor: pointer; transition: background 0.2s; text-align: left; font-size: 0.85em; color: var(--text-color); }
    .custom-option:hover { background-color: #f8f9fa; }
    .custom-option.selected { color: var(--primary-color); background-color: #f0f7ff; font-weight: 600; }
    
    /* 题目区域 */
    #sentence-area {
        height: 120px; 
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 20px; flex-shrink: 0; margin-top: 10px;
    }
    #sentence-container { font-size: 1.8em; line-height: 1.6; color: var(--text-color); font-weight: 700; }
    #sentence-container .blank { color: transparent; border-bottom: 3px solid var(--primary-color); padding: 0 5px; margin: 0 8px; display: inline-block; min-width: 80px; text-align: center; height: 1.2em; }
    #sentence-container .highlight { color: var(--primary-color); border-bottom: none; }
    
    /* 选项区域 */
    #options-container { 
        display: grid; grid-template-columns: 1fr 1fr; gap: 20px; 
        margin-bottom: 30px; flex-shrink: 0; height: 180px; 
    }
    .option-btn {
        display: flex; align-items: center; gap: 15px; padding: 0 25px;
        height: 80px; font-size: 1.1em; background-color: #fff; 
        border: 1px solid var(--border-color); border-radius: 16px; 
        cursor: pointer; transition: all .2s; font-weight: 600; color: var(--text-color); 
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .option-btn:hover:not(.answered) { border-color: var(--primary-color); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(74, 144, 226, 0.1); }
    .option-btn.answered { cursor: default; }
    .key-hint { font-size: .85em; font-weight: 700; background-color: #e9ecef; color: var(--light-text-color); width: 32px; height: 32px; border-radius: 8px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .option-text { flex-grow: 1; text-align: left; }
    
    .option-btn.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
    .option-btn.correct .key-hint { background-color: rgba(255,255,255,0.6); color: var(--correct-text); }
    .option-btn.selected.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
    .option-btn.selected.incorrect .key-hint { background-color: rgba(255,255,255,0.6); color: var(--incorrect-text); }
    
    /* 底部区域 */
    .bottom-section {
        flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; position: relative;
    }

    #feedback {
        padding: 25px; border-radius: 16px; text-align: left;
        font-size: 1.05em; line-height: 1.7; 
        height: 180px; overflow-y: auto;
        visibility: hidden; opacity: 0; transition: opacity 0.3s;
        margin-bottom: 20px; scrollbar-width: none; 
    }
    #feedback::-webkit-scrollbar { display: none; }
    #feedback.visible { visibility: visible; opacity: 1; }
    #feedback.correct { background-color: var(--correct-bg); border: 1px solid var(--correct-border); color: #1b5e20; }
    #feedback.incorrect { background-color: var(--incorrect-bg); border: 1px solid var(--incorrect-border); color: #b71c1c; }
    #feedback-title { font-weight: 800; font-size: 1.2em; margin-bottom: 10px; }
    #feedback p { margin: 5px 0; }

    #next-btn-container { 
        height: 50px; display: flex; justify-content: center; 
        visibility: hidden; opacity: 0; transition: opacity 0.3s;
    }
    #next-btn-container.visible { visibility: visible; opacity: 1; }

    #next-btn {
        padding: 14px 50px; font-size: 1.1em; font-weight: 700; 
        background-color: var(--primary-color); color: #fff; border-radius: 30px; border: none; 
        cursor: pointer; box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
        transition: all 0.2s;
    }
    #next-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(74, 144, 226, 0.5); }
    
    #score {
        position: fixed; top: 25px; right: 30px; 
        font-size: 0.95em; font-weight: 700;
        background-color: #fff; color: var(--text-color);
        padding: 12px 24px; border-radius: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        z-index: 100;
    }

    #notification {
        position: fixed; top: 30px; left: 50%; transform: translate(-50%, -20px);
        background-color: #2c3e50; color: #fff;
        padding: 12px 30px; border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        font-size: 1em; font-weight: 600;
        z-index: 1000; opacity: 0; pointer-events: none;
        transition: all 0.3s;
    }
    #notification.visible { opacity: 1; transform: translate(-50%, 0); }

    /* ★★★ 移动端 终极修复 (Mobile Fix) ★★★ */
    @media (max-width: 768px) {
        body { 
            padding: 15px 10px; 
            align-items: flex-start;
        }
        
        #game-container { 
            padding: 25px 20px; 
            min-height: auto; 
            height: auto;
            border-radius: 20px;
            margin-top: 10px;
        }
        
        h1 { font-size: 1.6em; margin-bottom: 5px; }
        #subtitle { margin-bottom: 20px; font-size: 0.9em; }

        /* 头部改为垂直堆叠 */
        .app-header { flex-direction: column; align-items: stretch; gap: 15px; margin-bottom: 10px; }
        .header-left { flex-direction: column; align-items: stretch; gap: 10px; }
        .header-right { justify-content: center; } /* 复习按钮居中 */
        
        /* 关键修复：下拉菜单宽度和交互 */
        .custom-select-wrapper { width: 100%; }
        .custom-select-trigger { width: 100%; justify-content: space-between; }
        
        /* 关键修复：手机端下拉菜单不再悬浮，而是嵌入流中，防止遮挡 */
        .custom-select-options { 
            position: static; /* 取消绝对定位 */
            width: 100%; 
            opacity: 1; 
            visibility: visible;
            display: none; /* 默认隐藏 */
            box-shadow: none;
            border: 1px solid var(--border-color);
            transform: none;
            margin-top: 5px;
        }
        .custom-select-wrapper.open .custom-select-options { 
            display: block; /* 展开时把下面内容顶下去 */
            animation: slideDownMobile 0.2s ease-out;
        }
        
        @keyframes slideDownMobile {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-group { justify-content: space-between; width: 100%; }
        .btn { flex: 1; text-align: center; }
        
        /* 题目区域 */
        #sentence-area { height: auto; min-height: 80px; margin: 20px 0; }
        #sentence-container { font-size: 1.3em; line-height: 1.5; }
        
        /* 选项区域 - 单列 */
        #options-container { grid-template-columns: 1fr; height: auto; gap: 12px; }
        .option-btn { height: auto; padding: 15px; min-height: 60px; }
        
        /* 反馈区域 */
        #feedback { height: auto; min-height: 120px; max-height: 300px; padding: 20px; }
        
        /* 分数显示在卡片内部上方 */
        #score { 
            position: absolute; 
            top: 15px; 
            right: 15px;
            padding: 4px 10px;
            font-size: 0.8em;
            box-shadow: none;
            border: 1px solid var(--border-color);
            background: #f8f9fa;
        }
    }
</style>
</head>
<body>
    
<div id="game-container">
    <!-- Score 移入内部，方便定位 -->
    <div id="score">Score: 0 / 0</div>

    <div class="header-section">
        <h1>日本語文法クエスト</h1>
        <p id="subtitle">JLPT N1 & N2 Grammar Mastery</p>
    </div>
    
    <header class="app-header">
        <div class="header-left">
            <div class="custom-select-wrapper">
                <div id="custom-select-trigger" class="custom-select-trigger">
                    <span>練習セット 1</span>
                    <div class="arrow"></div>
                </div>
                <div id="custom-select-options" class="custom-select-options">
                    <div class="custom-option" data-value="1">練習セット 1</div>
                    <div class="custom-option" data-value="2">練習セット 2</div>
                    <div class="custom-option" data-value="3">練習セット 3</div>
                </div>
            </div>

            <div class="control-group" id="level-filter-group">
                <button id="filter-all" class="btn level-btn active">All</button>
                <button id="filter-n2" class="btn level-btn">N2</button>
                <button id="filter-n1" class="btn level-btn">N1</button>
            </div>
        </div>

        <div class="header-right">
             <button id="review-btn" class="btn">復習モード (0)</button>
        </div>
    </header>

    <div id="sentence-area">
        <div id="sentence-container">Loading...</div>
    </div>
    
    <div id="options-container"></div>
    
    <div class="bottom-section">
        <div id="feedback"></div>
        <div id="next-btn-container">
            <button id="next-btn">次の問題 (Space)</button>
        </div>
    </div>
</div>

<div id="notification"></div>

<script>
    let grammarData = [];
    let dataByLevel = { N1: [], N2: [] };
    let allAnswersPool = [];
    let shuffledQuestionPool = [];
    let currentQuestionIndex = 0;

    const sentenceContainer = document.getElementById('sentence-container');
    const optionsContainer = document.getElementById('options-container');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const nextBtnContainer = document.getElementById('next-btn-container'); 
    const scoreEl = document.getElementById('score');
    const reviewBtn = document.getElementById('review-btn');
    const levelFilterButtons = document.querySelectorAll('.level-btn');
    const customSelectWrapper = document.querySelector('.custom-select-wrapper');
    const customSelectTrigger = document.getElementById('custom-select-trigger');
    const customSelectOptions = document.querySelectorAll('.custom-option');
    const notificationEl = document.getElementById('notification');
    let notificationTimeout;

    const optionButtons = [];
    const optionTextElements = [];
    const keyHintElements = [];

    let currentQuestion = {}, score = 0, totalQuestions = 0, isAnswered = false;
    let mistakeIds = [];
    let isReviewMode = false, currentLevel = 'All', currentSetId = '1', pausedState = null;

    function showNotification(message) {
        clearTimeout(notificationTimeout);
        notificationEl.textContent = message;
        notificationEl.classList.add('visible');
        notificationTimeout = setTimeout(() => {
            notificationEl.classList.remove('visible');
        }, 2500);
    }

    function initUI() {
        for (let i = 0; i < 4; i++) {
            const button = document.createElement('button');
            button.className = 'option-btn';
            const keyHint = document.createElement('span');
            keyHint.className = 'key-hint';
            keyHint.textContent = i + 1;
            const optionText = document.createElement('span');
            optionText.className = 'option-text';
            button.appendChild(keyHint);
            button.appendChild(optionText);
            optionsContainer.appendChild(button);
            optionButtons.push(button);
            keyHintElements.push(keyHint);
            optionTextElements.push(optionText);
        }
    }

    function getMistakeKey() { return `japaneseGrammarMistakes_set${currentSetId}`; }
    function loadMistakes() { mistakeIds = JSON.parse(localStorage.getItem(getMistakeKey())) || []; }
    function saveMistakes() { localStorage.setItem(getMistakeKey(), JSON.stringify(mistakeIds)); }
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function updateReviewButton() {
        reviewBtn.textContent = isReviewMode ? '通常モードに戻る' : `復習モード (${mistakeIds.length})`;
        reviewBtn.disabled = mistakeIds.length === 0 && !isReviewMode;
        reviewBtn.classList.toggle('active', isReviewMode);
    }

    function updateScore() {
        // 手机端始终显示 Score
        scoreEl.style.display = isReviewMode ? 'none' : 'block';
        if (!isReviewMode) {
            scoreEl.textContent = `Score: ${score} / ${totalQuestions}`;
        }
    }

    function updateUiForModeChange() {
        updateReviewButton();
        updateScore();
        customSelectWrapper.classList.toggle('disabled', isReviewMode);
        document.getElementById('level-filter-group').classList.toggle('disabled', isReviewMode);
        if (!isReviewMode) {
            levelFilterButtons.forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${currentLevel.toLowerCase()}`).classList.add('active');
        }
    }

    function startNewQuiz() {
        if (isReviewMode) {
            const reversedIds = [...mistakeIds].reverse();
            const grammarDataMap = new Map(grammarData.map(q => [q.id, q]));
            shuffledQuestionPool = reversedIds.map(id => grammarDataMap.get(id)).filter(Boolean);
        } else {
            shuffledQuestionPool = (currentLevel === 'All') ? [...grammarData] : [...dataByLevel[currentLevel]];
            shuffleArray(shuffledQuestionPool);
        }
        currentQuestionIndex = 0;
        score = 0;
        totalQuestions = 0;
        updateScore();
        displayNextQuestion();
    }

    function setLevel(level, fromUrl = false) {
        if (currentLevel === level && !isReviewMode && !fromUrl) return;
        currentLevel = level;
        pausedState = null;
        levelFilterButtons.forEach(btn => btn.classList.remove('active'));
        document.getElementById(`filter-${level.toLowerCase()}`).classList.add('active');
        if (!fromUrl) updateURL();
        startNewQuiz();
    }

    function toggleReviewMode() {
        isReviewMode = !isReviewMode;
        if (isReviewMode) {
            if (mistakeIds.length === 0) {
                showNotification("復習する問題がありません。");
                isReviewMode = false;
                return;
            }
            pausedState = { currentQuestion, shuffledQuestionPool, currentQuestionIndex, score, totalQuestions, currentLevel };
            startNewQuiz();
        } else {
            if (pausedState) {
                ({ currentQuestion, shuffledQuestionPool, currentQuestionIndex, score, totalQuestions, currentLevel } = pausedState);
                renderQuestion(currentQuestion);
                updateScore();
                pausedState = null;
            } else {
                startNewQuiz();
            }
        }
        updateUiForModeChange();
    }

    function getDistractorOptions(correctAnswer) {
        const distractors = new Set();
        if (allAnswersPool.length < 4) {
            return allAnswersPool.filter(ans => ans !== correctAnswer);
        }
        let attempts = 0;
        const maxAttempts = Math.min(allAnswersPool.length, 50);
        while (distractors.size < 3 && attempts < maxAttempts) {
            const randomIndex = Math.floor(Math.random() * allAnswersPool.length);
            const potentialDistractor = allAnswersPool[randomIndex];
            if (potentialDistractor !== correctAnswer) {
                distractors.add(potentialDistractor);
            }
            attempts++;
        }
        return Array.from(distractors);
    }

    function renderQuestion(question) {
        currentQuestion = question;
        isAnswered = false;
        requestAnimationFrame(() => {
            feedbackEl.classList.remove('visible', 'correct', 'incorrect');
            nextBtnContainer.classList.remove('visible'); 
            optionsContainer.style.display = 'grid';
            if (!question || !question.sentence_parts) {
                sentenceContainer.innerHTML = "問題の読み込みに失敗しました。";
                optionsContainer.style.display = 'none';
                return;
            }
            const [part1, part2] = question.sentence_parts;
            sentenceContainer.innerHTML = `${part1}<span class="blank">＿＿＿</span>${part2}`;
            const distractors = getDistractorOptions(question.grammar_answer);
            const options = shuffleArray([question.grammar_answer, ...distractors]);
            optionButtons.forEach((button, index) => {
                if (options[index]) {
                    button.className = 'option-btn';
                    button.classList.remove('correct', 'incorrect', 'selected', 'answered'); 
                    button.style.display = '';
                    button.dataset.answer = options[index];
                    optionTextElements[index].textContent = options[index];
                } else {
                    button.style.display = 'none';
                }
            });
        });
    }

    function displayNextQuestion() {
        if (currentQuestionIndex >= shuffledQuestionPool.length) {
            showNotification("全ての問題を一周しました！もう一度始めます。");
            if (!isReviewMode) {
                shuffleArray(shuffledQuestionPool);
            }
            currentQuestionIndex = 0;
        }
        const nextQuestion = shuffledQuestionPool[currentQuestionIndex];
        if (!nextQuestion) {
            sentenceContainer.innerHTML = isReviewMode ? "復習する問題がありません。" : "このレベルには問題がありません。";
            optionsContainer.style.display = 'none';
            return;
        }
        currentQuestionIndex++;
        renderQuestion(nextQuestion);
    }

    function checkAnswer(selectedAnswer, selectedButton) {
        if (isAnswered) return;
        isAnswered = true;
        optionButtons.forEach(btn => btn.classList.add('answered'));
        if (!isReviewMode) totalQuestions++;
        const isCorrect = currentQuestion.grammar_answer === selectedAnswer;
        const [part1, part2] = currentQuestion.sentence_parts;
        const fullSentenceHTML = `${part1}<span class="highlight">${currentQuestion.grammar_answer}</span>${part2}`;
        const feedbackHTML = `<p><strong>文法：</strong> 「${currentQuestion.grammar_display}」</p><p><strong>接続：</strong> ${currentQuestion.connection}</p><p><strong>例文：</strong> ${fullSentenceHTML}</p>`;
        
        feedbackEl.className = ''; 
        
        if (isCorrect) {
            if (!isReviewMode) score++;
            feedbackEl.classList.add('correct', 'visible');
            feedbackEl.innerHTML = `<div id="feedback-title">Correct!</div>${feedbackHTML}`;
            selectedButton.classList.add('correct');
            const index = mistakeIds.indexOf(currentQuestion.id);
            if (index > -1) {
                mistakeIds.splice(index, 1);
                requestIdleCallback(() => {
                    saveMistakes();
                    updateReviewButton();
                });
            }
        } else {
            feedbackEl.classList.add('incorrect', 'visible');
            feedbackEl.innerHTML = `<div id="feedback-title">Incorrect</div>${feedbackHTML}`;
            selectedButton.classList.add('selected', 'incorrect');
            optionButtons.forEach(btn => {
                if (btn.dataset.answer === currentQuestion.grammar_answer) {
                    btn.classList.add('correct');
                }
            });
            const existingIndex = mistakeIds.indexOf(currentQuestion.id);
            if (existingIndex > -1) {
                mistakeIds.splice(existingIndex, 1);
            }
            mistakeIds.push(currentQuestion.id);
            requestIdleCallback(() => {
                saveMistakes();
                updateReviewButton();
            });
        }
        if (!isReviewMode) updateScore();
        nextBtnContainer.classList.add('visible'); 
        nextBtn.focus();
    }

    function handleKeyPress(e) {
        if (document.activeElement.tagName === 'BUTTON' || document.activeElement.tagName === 'SELECT') return;
        const key = e.key;
        if (isAnswered) {
            if (key === ' ' || key === 'Enter') {
                e.preventDefault();
                displayNextQuestion();
            }
            return;
        }
        const numKey = parseInt(key);
        if (!isNaN(numKey) && numKey >= 1 && numKey <= 4) {
            const button = optionButtons[numKey - 1];
            if (button && button.style.display !== 'none' && !button.classList.contains('answered')) {
                e.preventDefault();
                checkAnswer(button.dataset.answer, button);
            }
        }
    }

    function loadSet(setId, onSetLoadedCallback) {
        currentSetId = setId;
        const oldScript = document.getElementById('grammar-data-script');
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = 'grammar-data-script';
        script.src = setId === '1' ? './grammar-data.js' :
                     setId === '2' ? './grammar-data-set2.js' : './grammar-data-set3.js';
        script.onload = () => {
            dataByLevel = { N1: [], N2: [] };
            const uniqueAnswers = new Set();
            grammarData.forEach(item => {
                if (dataByLevel[item.level]) {
                    dataByLevel[item.level].push(item);
                }
                uniqueAnswers.add(item.grammar_answer);
            });
            allAnswersPool = Array.from(uniqueAnswers);
            loadMistakes();
            updateReviewButton();
            if (onSetLoadedCallback) onSetLoadedCallback();
        };
        script.onerror = () => {
            sentenceContainer.innerHTML = `エラー: 練習セット${setId}のデータファイルが見つかりません。<br><span style="font-size: 0.7em; color: var(--light-text-color);">${script.src} を確認してください。</span>`;
            optionsContainer.style.display = 'none';
        };
        document.body.appendChild(script);
    }

    function updateURL() {
        if (isReviewMode) return;
        const params = new URLSearchParams();
        params.set('set', currentSetId);
        if (currentLevel !== 'All') params.set('level', currentLevel);
        window.location.hash = params.toString();
    }

    function updateCustomSelectUI(setId) {
        const triggerSpan = customSelectTrigger.querySelector('span');
        const selectedOption = document.querySelector(`.custom-option[data-value="${setId}"]`);
        
        if (selectedOption && triggerSpan) {
            triggerSpan.textContent = selectedOption.textContent;
            customSelectOptions.forEach(opt => opt.classList.remove('selected'));
            selectedOption.classList.add('selected');
        }
    }

    nextBtn.addEventListener('click', displayNextQuestion);
    reviewBtn.addEventListener('click', toggleReviewMode);
    document.addEventListener('keydown', handleKeyPress);
    document.getElementById('filter-all').addEventListener('click', () => setLevel('All'));
    document.getElementById('filter-n2').addEventListener('click', () => setLevel('N2'));
    document.getElementById('filter-n1').addEventListener('click', () => setLevel('N1'));
    
    optionsContainer.addEventListener('click', (e) => {
        if (isAnswered) return;
        const clickedButton = e.target.closest('.option-btn');
        if (clickedButton && clickedButton.style.display !== 'none') {
            const selectedAnswer = clickedButton.dataset.answer;
            checkAnswer(selectedAnswer, clickedButton);
        }
    });
    
    customSelectTrigger.addEventListener('click', () => customSelectWrapper.classList.toggle('open'));
    window.addEventListener('click', (e) => {
        if (!customSelectWrapper.contains(e.target)) {
            customSelectWrapper.classList.remove('open');
        }
    });

    customSelectOptions.forEach(option => {
        option.addEventListener('click', () => {
            if (!option.classList.contains('selected')) {
                const newSetId = option.getAttribute('data-value');
                loadSet(newSetId, () => {
                    updateCustomSelectUI(newSetId);
                    setLevel('All', true);
                    updateURL();
                });
            }
            customSelectWrapper.classList.remove('open');
        });
    });

    window.onload = () => {
        initUI();
        const params = new URLSearchParams(window.location.hash.substring(1));
        const initialSet = params.get('set') || '1';
        const initialLevel = params.get('level') || 'All';
        
        loadSet(initialSet, () => {
            updateCustomSelectUI(initialSet);
            setLevel(initialLevel, true);
        });
    };
</script>
</body>
</html>
